<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a237e">
<!-- iOS: פתיחה ללא שורת URL -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ברמן 💰">
<!-- Android -->
<meta name="mobile-web-app-capable" content="yes">
<title>ברמן 💰</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

/*
  כל הגדלים ב-vw כדי לעבוד נכון בתוך ה-sandbox של Apps Script.
  על מסך 390px: 1vw = 3.9px → 4.5vw ≈ 17.5px
*/
html  { font-size: 4.5vw; }
body  {
  font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
  direction: rtl;
  background: #eef0f8;
  color: #111;
  min-height: 100vh;
  padding-bottom: 20vw;        /* מקום לכפתור הצמוד */
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.hdr {
  background: #1a237e;
  padding: 4vw 5vw 3vw;
}
.hdr-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3vw;
}
.hdr h1 { font-size: 5.5vw; font-weight: 900; color: #fff; }
.month-chip {
  background: rgba(255,255,255,.18);
  color: rgba(255,255,255,.9);
  font-size: 3.5vw;
  font-weight: 700;
  padding: 1vw 3vw;
  border-radius: 10vw;
}

/* ── SUMMARY STRIP ── */
.summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2vw;
}
.s-box {
  background: rgba(255,255,255,.13);
  border-radius: 3vw;
  padding: 2.5vw 2vw;
  text-align: center;
}
.s-lbl { font-size: 3vw; color: rgba(255,255,255,.65); font-weight: 700; margin-bottom: 1vw; }
.s-val { font-size: 4.5vw; font-weight: 900; color: #fff; }
.s-box.pos { background: rgba(27,94,32,.5); }
.s-box.pos .s-val { color: #a5d6a7; }
.s-box.neg { background: rgba(183,28,28,.5); }
.s-box.neg .s-val { color: #ef9a9a; }

/* ── CARD ── */
.card {
  background: #fff;
  border-radius: 4vw;
  margin: 3.5vw 3.5vw 0;
  overflow: hidden;
  box-shadow: 0 0.5vw 2vw rgba(0,0,0,.08);
}
.card-title {
  font-size: 3.8vw;
  font-weight: 800;
  color: #1565c0;
  padding: 4vw 4.5vw 0;
}

/* ── FORM ── */
.form-body { padding: 3.5vw 4.5vw 4.5vw; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; margin-bottom: 3vw; }
.solo { margin-bottom: 3vw; }

.fld { display: flex; flex-direction: column; gap: 1.5vw; }
.fld label {
  font-size: 3.2vw;
  font-weight: 800;
  color: #6b7280;
  text-transform: uppercase;
  letter-spacing: .06em;
}

/* ── INPUTS ── */
input[type="date"],
input[type="number"],
input[type="text"] {
  width: 100%;
  height: 13.5vw;
  padding: 0 3.5vw;
  border: 0.6vw solid #d1d5f0;
  border-radius: 3vw;
  font-size: 4.5vw;
  font-weight: 600;
  color: #111;
  background: #f4f6fb;
  -webkit-appearance: none;
  appearance: none;
  transition: border .15s, box-shadow .15s;
}
input:focus {
  outline: none;
  border-color: #1565c0;
  background: #fff;
  box-shadow: 0 0 0 1vw rgba(21,101,192,.12);
}

/* ── SHIFT PILLS ── */
.pills {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2.5vw;
}
.pill {
  height: 16vw;
  border: 0.6vw solid #d1d5f0;
  border-radius: 3vw;
  background: #f4f6fb;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5vw;
  cursor: pointer;
  transition: all .15s;
}
.pill:active { transform: scale(.94); }
.pill-icon { font-size: 6.5vw; }
.pill-text { font-size: 3.5vw; font-weight: 800; color: #6b7280; }
.pill.on {
  border-color: #1565c0;
  background: #e8eaf6;
}
.pill.on .pill-text { color: #1565c0; }

/* ── LIVE CALC ── */
.calc-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2.5vw;
  margin: 3vw 0 2vw;
}
.c-box {
  background: #e8eaf6;
  border-radius: 3vw;
  padding: 3vw 2vw;
  text-align: center;
}
.c-lbl { font-size: 3vw; color: #5c6bc0; font-weight: 700; margin-bottom: 1vw; }
.c-val { font-size: 5.5vw; font-weight: 900; color: #1a237e; }

.diff-bar {
  border-radius: 3vw;
  padding: 3vw 4vw;
  text-align: center;
  font-size: 4vw;
  font-weight: 800;
  margin-bottom: 3vw;
}
.d-pos  { background: #e8f5e9; color: #1b5e20; }
.d-neg  { background: #ffebee; color: #b71c1c; }
.d-zero { background: #e3f2fd; color: #0d47a1; }

/* ── STICKY SAVE ── */
.save-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 3vw 4vw;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-top: 0.3vw solid #e0e0e0;
  z-index: 100;
}
.btn-save {
  width: 100%;
  height: 14vw;
  background: #1565c0;
  color: #fff;
  border: none;
  border-radius: 3.5vw;
  font-size: 5vw;
  font-weight: 900;
  cursor: pointer;
  transition: background .12s, transform .08s;
}
.btn-save:active { transform: scale(.97); background: #1a237e; }
.btn-save:disabled { background: #b0bec5; transform: none; }

/* ── RECENT ── */
.recent-body { padding: 2vw 4.5vw 4vw; }
.r-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3.5vw 0;
  border-bottom: 0.3vw solid #eef0f8;
}
.r-item:last-child { border-bottom: none; }
.r-date  { font-size: 4.2vw; font-weight: 800; }
.r-meta  { font-size: 3.2vw; color: #6b7280; margin-top: 0.8vw; }
.r-amt   { font-size: 5vw; font-weight: 900; text-align: left; }
.r-diff  { font-size: 3.2vw; font-weight: 700; text-align: left; margin-top: 0.8vw; }
.pos { color: #1b5e20; }
.neg { color: #b71c1c; }
.empty { text-align: center; color: #9ca3af; padding: 5vw 0; font-size: 4vw; }

/* ── WARN ── */
.warn {
  margin: 3.5vw 3.5vw 0;
  background: #fff8e1;
  border-radius: 4vw;
  padding: 3.5vw 4vw;
  font-size: 3.5vw;
  color: #e65100;
  text-align: center;
  line-height: 1.6;
  font-style: italic;
}

/* ── TOAST ── */
#toast {
  position: fixed;
  top: 4vw; left: 50%;
  transform: translateX(-50%) translateY(-30vw);
  padding: 3.5vw 7vw;
  border-radius: 15vw;
  font-size: 4vw; font-weight: 800;
  white-space: nowrap;
  z-index: 999;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
  box-shadow: 0 1vw 5vw rgba(0,0,0,.2);
}
#toast.in { transform: translateX(-50%) translateY(0); }
#toast.ok  { background: #1b5e20; color: #fff; }
#toast.err { background: #b71c1c; color: #fff; }

/* ── SKELETON ── */
.sk-dark {
  display: block; border-radius: 2vw;
  background: linear-gradient(90deg,rgba(255,255,255,.12) 25%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.12) 75%);
  background-size: 200% 100%;
  animation: sh 1.3s infinite;
}
.sk-light {
  display: block; border-radius: 2vw;
  background: linear-gradient(90deg,#e8eaf6 25%,#f0f0f5 50%,#e8eaf6 75%);
  background-size: 200% 100%;
  animation: sh 1.3s infinite;
}
@keyframes sh { from{background-position:200% 0} to{background-position:-200% 0} }
</style>
</head>
<body>

<!-- HEADER + SUMMARY -->
<div class="hdr">
  <div class="hdr-top">
    <h1>💰 הכנסות ברמן</h1>
    <span class="month-chip" id="monthChip">טוען...</span>
  </div>
  <div class="summary" id="summary">
    <div class="s-box"><span class="sk-dark" style="height:3vw;width:55%;margin:0 auto 1.5vw"></span><span class="sk-dark" style="height:5vw;width:70%;margin:0 auto"></span></div>
    <div class="s-box"><span class="sk-dark" style="height:3vw;width:55%;margin:0 auto 1.5vw"></span><span class="sk-dark" style="height:5vw;width:70%;margin:0 auto"></span></div>
    <div class="s-box"><span class="sk-dark" style="height:3vw;width:55%;margin:0 auto 1.5vw"></span><span class="sk-dark" style="height:5vw;width:70%;margin:0 auto"></span></div>
  </div>
</div>

<!-- FORM CARD -->
<div class="card">
  <div class="card-title">➕  הוסף יום</div>
  <div class="form-body">

    <div class="row2">
      <div class="fld">
        <label>📅 תאריך</label>
        <input type="date" id="date">
      </div>
      <div class="fld">
        <label>⏱ שעות</label>
        <input type="number" id="hours" step="0.5" min="1" max="16" placeholder="8" inputmode="decimal">
      </div>
    </div>

    <div class="solo">
      <div class="fld">
        <label>🎯 משמרת</label>
        <div class="pills">
          <button class="pill" onclick="pick(this,'פתיחה')">
            <span class="pill-icon">🌅</span><span class="pill-text">פתיחה</span>
          </button>
          <button class="pill" onclick="pick(this,'סגירה')">
            <span class="pill-icon">🌙</span><span class="pill-text">סגירה</span>
          </button>
          <button class="pill" onclick="pick(this,'כפולה')">
            <span class="pill-icon">⚡</span><span class="pill-text">כפולה</span>
          </button>
        </div>
      </div>
    </div>

    <div class="solo">
      <div class="fld">
        <label>💵 סכום מגיע (₪)</label>
        <input type="number" id="owed" step="0.01" min="0" placeholder="0" inputmode="decimal" oninput="calc()">
      </div>
    </div>

    <div class="row2" style="margin-bottom:0">
      <div class="fld">
        <label>💰 מזומן (₪)</label>
        <input type="number" id="cash" step="0.01" min="0" placeholder="0" inputmode="decimal" oninput="calc()">
      </div>
      <div class="fld">
        <label>🏦 צ'ק (₪)</label>
        <input type="number" id="check" step="0.01" min="0" placeholder="0" inputmode="decimal" oninput="calc()">
      </div>
    </div>

    <div class="calc-row">
      <div class="c-box">
        <div class="c-lbl">מגיע</div>
        <div class="c-val" id="cOwed">₪0</div>
      </div>
      <div class="c-box">
        <div class="c-lbl">סה"כ התקבל</div>
        <div class="c-val" id="cTotal">₪0</div>
      </div>
    </div>

    <div class="diff-bar d-zero" id="diffBar">הפרש: ₪0.00</div>

    <div class="fld">
      <label>📝 הערות</label>
      <input type="text" id="notes" placeholder="הערה קצרה (רשות)">
    </div>

  </div>
</div>

<!-- RECENT -->
<div class="card">
  <div class="card-title">🕐  אחרונות</div>
  <div class="recent-body" id="recentList">
    <div class="r-item"><span class="sk-light" style="height:11vw;width:100%"></span></div>
    <div class="r-item"><span class="sk-light" style="height:11vw;width:100%"></span></div>
    <div class="r-item"><span class="sk-light" style="height:11vw;width:100%"></span></div>
  </div>
</div>

<div class="warn">⚠️ תלוש שכר מגיע ב-10 לחודש<br>ייתכן שסכומים מתחילת החודש הבא ייכנסו לתלוש</div>

<!-- STICKY SAVE BUTTON -->
<div class="save-bar">
  <button class="btn-save" id="btnSave" onclick="save()">✅  שמור</button>
</div>

<div id="toast"></div>

<script>
  // תאריך היום
  var today = new Date();
  document.getElementById('date').value =
    today.getFullYear() + '-' +
    ('0'+(today.getMonth()+1)).slice(-2) + '-' +
    ('0'+today.getDate()).slice(-2);

  var shiftVal = '';

  function pick(btn, val) {
    shiftVal = val;
    document.querySelectorAll('.pill').forEach(function(p){ p.classList.remove('on'); });
    btn.classList.add('on');
  }

  function rn(n)  { return Math.round(Math.abs(n)).toLocaleString('he-IL'); }
  function f2(n)  { return Math.abs(n).toFixed(2); }

  function calc() {
    var owed  = parseFloat(document.getElementById('owed').value)  || 0;
    var cash  = parseFloat(document.getElementById('cash').value)  || 0;
    var chk   = parseFloat(document.getElementById('check').value) || 0;
    var total = cash + chk;
    var diff  = total - owed;

    document.getElementById('cOwed').textContent  = '₪' + rn(owed);
    document.getElementById('cTotal').textContent = '₪' + rn(total);

    var bar = document.getElementById('diffBar');
    bar.className = 'diff-bar';
    if (diff > 0.005) {
      bar.classList.add('d-pos');
      bar.textContent = 'הפרש: +₪' + f2(diff) + '  ✓ קיבלת יותר';
    } else if (diff < -0.005) {
      bar.classList.add('d-neg');
      bar.textContent = 'הפרש: -₪' + f2(-diff) + '  ⚠️ עוד חסר';
    } else {
      bar.classList.add('d-zero');
      bar.textContent = owed > 0 ? 'הפרש: ₪0.00  ✓ מדויק!' : 'הפרש: ₪0.00';
    }
  }

  function save() {
    if (!document.getElementById('date').value) { toast('נא להזין תאריך','err'); return; }
    var btn = document.getElementById('btnSave');
    btn.disabled = true; btn.textContent = '⏳ שומר...';
    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false; btn.textContent = '✅  שמור';
        toast(res.message, res.success ? 'ok' : 'err');
        if (res.success) { clearForm(); loadSummary(); loadRecent(); }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = '✅  שמור';
        toast('שגיאה: ' + e.message, 'err');
      })
      .addEntry({
        date:  document.getElementById('date').value,
        shift: shiftVal,
        hours: document.getElementById('hours').value,
        owed:  document.getElementById('owed').value,
        cash:  document.getElementById('cash').value,
        check: document.getElementById('check').value,
        notes: document.getElementById('notes').value
      });
  }

  function clearForm() {
    var n = new Date();
    document.getElementById('date').value =
      n.getFullYear() + '-' + ('0'+(n.getMonth()+1)).slice(-2) + '-' + ('0'+n.getDate()).slice(-2);
    ['hours','owed','cash','check','notes'].forEach(function(id){ document.getElementById(id).value = ''; });
    shiftVal = '';
    document.querySelectorAll('.pill').forEach(function(p){ p.classList.remove('on'); });
    calc();
  }

  function toast(msg, type) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.className = type;
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.add('in'); }); });
    clearTimeout(el._t);
    el._t = setTimeout(function(){ el.classList.remove('in'); }, 2600);
  }

  function loadSummary() {
    google.script.run
      .withSuccessHandler(function(s) {
        document.getElementById('monthChip').textContent = s.month;
        var d = s.diff, pos = d >= 0;
        document.getElementById('summary').innerHTML =
          '<div class="s-box">' +
            '<div class="s-lbl">ימי עבודה</div>' +
            '<div class="s-val">' + s.days + '</div>' +
          '</div>' +
          '<div class="s-box">' +
            '<div class="s-lbl">סכום מגיע</div>' +
            '<div class="s-val">₪' + rn(s.owed) + '</div>' +
          '</div>' +
          '<div class="s-box ' + (pos?'pos':'neg') + '">' +
            '<div class="s-lbl">הפרש</div>' +
            '<div class="s-val">' + (pos?'+':'-') + '₪' + rn(d) + '</div>' +
          '</div>';
      })
      .getCurrentMonthSummary();
  }

  function loadRecent() {
    google.script.run
      .withSuccessHandler(function(list) {
        var el = document.getElementById('recentList');
        if (!list || !list.length) {
          el.innerHTML = '<div class="empty">אין הזנות עדיין החודש</div>';
          return;
        }
        el.innerHTML = list.map(function(e) {
          var diff = parseFloat(e.diff) || 0;
          var cls  = diff >= 0 ? 'pos' : 'neg';
          var sign = diff >= 0 ? '+' : '-';
          var meta = [e.day, e.shift, e.hours ? e.hours + " שע'" : ''].filter(Boolean).join(' · ');
          return '<div class="r-item">' +
            '<div><div class="r-date">' + e.date + '</div><div class="r-meta">' + meta + '</div></div>' +
            '<div><div class="r-amt">₪' + rn(e.received) + '</div>' +
            '<div class="r-diff ' + cls + '">' + sign + '₪' + f2(Math.abs(diff)) + '</div></div>' +
          '</div>';
        }).join('');
      })
      .getRecentEntries();
  }

  loadSummary();
  loadRecent();

  // יצירת אייקון דינמי למסך הבית (iOS + Android)
  (function() {
    var c = document.createElement('canvas');
    c.width = c.height = 192;
    var ctx = c.getContext('2d');

    // עיגול רקע כחול
    ctx.fillStyle = '#1a237e';
    if (ctx.roundRect) {
      ctx.beginPath(); ctx.roundRect(0, 0, 192, 192, 40); ctx.fill();
    } else {
      ctx.fillRect(0, 0, 192, 192);
    }

    // סמל שקל
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 110px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('₪', 96, 106);

    var dataUrl = c.toDataURL('image/png');

    // apple-touch-icon (iOS)
    var appleIcon = document.createElement('link');
    appleIcon.rel  = 'apple-touch-icon';
    appleIcon.sizes = '192x192';
    appleIcon.href = dataUrl;
    document.head.appendChild(appleIcon);

    // shortcut icon (Android / Browser)
    var favicon = document.createElement('link');
    favicon.rel  = 'icon';
    favicon.type = 'image/png';
    favicon.href = dataUrl;
    document.head.appendChild(favicon);
  })();
</script>
</body>
</html>
