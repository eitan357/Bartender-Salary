<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a237e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>הכנסות ברמן</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --blue:    #1565c0;
  --dark:    #1a237e;
  --green:   #1b5e20;
  --green-l: #e8f5e9;
  --red:     #b71c1c;
  --red-l:   #ffebee;
  --gray:    #f0f2f8;
  --border:  #dde1f0;
  --text:    #111827;
  --muted:   #6b7280;
  --r:       16px;
}

html { font-size: 16px; }

body {
  font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
  direction: rtl;
  background: var(--gray);
  color: var(--text);
  min-height: 100svh;
  padding-bottom: 100px; /* מקום לכפתור קבוע */
  -webkit-font-smoothing: antialiased;
}

/* ─── HEADER ─── */
.top-bar {
  background: var(--dark);
  padding: 18px 20px 12px;
  padding-top: calc(18px + env(safe-area-inset-top));
}
.top-bar h1 { font-size: 22px; font-weight: 800; color: #fff; }

/* ─── SUMMARY ROW ─── */
.summary-row {
  background: var(--dark);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 0 16px 16px;
}
.s-box {
  background: rgba(255,255,255,.13);
  border-radius: 12px;
  padding: 10px 8px;
  text-align: center;
}
.s-lbl { font-size: 11px; color: rgba(255,255,255,.65); font-weight: 600; margin-bottom: 4px; }
.s-val { font-size: 17px; font-weight: 900; color: #fff; }
.s-box.pos { background: rgba(27,94,32,.5); }
.s-box.pos .s-val { color: #a5d6a7; }
.s-box.neg { background: rgba(183,28,28,.5); }
.s-box.neg .s-val { color: #ef9a9a; }

/* ─── SECTION CARD ─── */
.sec {
  background: #fff;
  border-radius: var(--r);
  margin: 14px 12px 0;
  overflow: hidden;
}
.sec-title {
  font-size: 13px;
  font-weight: 800;
  color: var(--blue);
  padding: 16px 18px 0;
  letter-spacing: .2px;
}

/* ─── FORM ─── */
.form-pad { padding: 14px 18px 18px; }

.frow { display: grid; gap: 12px; margin-bottom: 12px; }
.frow-2 { grid-template-columns: 1fr 1fr; }
.frow-3 { grid-template-columns: 1fr 1fr 1fr; }

.frow:last-child { margin-bottom: 0; }

.fld { display: flex; flex-direction: column; gap: 6px; }
.fld label {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .5px;
}

/* ─── INPUTS ─── */
input[type="date"],
input[type="number"],
input[type="text"] {
  width: 100%;
  height: 52px;
  padding: 0 14px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
  background: var(--gray);
  -webkit-appearance: none;
  appearance: none;
  transition: border .15s, box-shadow .15s;
}
input:focus {
  outline: none;
  border-color: var(--blue);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(21,101,192,.12);
}

/* ─── SHIFT BUTTONS ─── */
.shift-pills {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.pill {
  height: 56px;
  border: 2px solid var(--border);
  border-radius: 12px;
  background: var(--gray);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}
.pill:active { transform: scale(.95); }
.pill .pi  { font-size: 20px; }
.pill .pt  { font-size: 13px; font-weight: 700; color: var(--muted); }
.pill.on   {
  border-color: var(--blue);
  background: #e8eaf6;
}
.pill.on .pt { color: var(--blue); }

/* ─── LIVE CALC ─── */
.calc-strip {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 12px 0 8px;
}
.c-box {
  background: #e8eaf6;
  border-radius: 12px;
  padding: 12px;
  text-align: center;
}
.c-lbl { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
.c-val { font-size: 20px; font-weight: 900; color: var(--dark); }

.diff-tag {
  border-radius: 12px;
  padding: 12px;
  text-align: center;
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 14px;
}
.dt-pos  { background: var(--green-l); color: var(--green); }
.dt-neg  { background: var(--red-l);   color: var(--red);   }
.dt-zero { background: #e3f2fd;        color: #0d47a1;      }

/* ─── STICKY SAVE ─── */
.save-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  z-index: 100;
}
.btn-save {
  width: 100%;
  height: 54px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
  transition: background .12s, transform .08s;
}
.btn-save:active { transform: scale(.97); background: var(--dark); }
.btn-save:disabled { background: #b0bec5; transform: none; }

/* ─── RECENT ─── */
.recent-pad { padding: 8px 18px 16px; }
.r-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid var(--gray);
}
.r-item:last-child { border-bottom: none; }
.r-date  { font-size: 16px; font-weight: 800; }
.r-meta  { font-size: 12px; color: var(--muted); margin-top: 2px; }
.r-amt   { font-size: 18px; font-weight: 900; text-align: left; }
.r-diff  { font-size: 12px; font-weight: 700; text-align: left; margin-top: 2px; }
.pos { color: var(--green); }
.neg { color: var(--red);   }

.empty { text-align: center; color: var(--muted); padding: 20px 0; font-size: 14px; }

/* ─── WARN ─── */
.warn {
  margin: 14px 12px 0;
  background: #fff8e1;
  border-radius: 14px;
  padding: 13px 16px;
  font-size: 12px;
  color: #e65100;
  text-align: center;
  line-height: 1.6;
  font-style: italic;
}

/* ─── TOAST ─── */
#toast {
  position: fixed;
  top: 24px; left: 50%;
  transform: translateX(-50%) translateY(-80px);
  padding: 13px 26px;
  border-radius: 30px;
  font-size: 15px; font-weight: 700;
  white-space: nowrap;
  z-index: 999;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
  box-shadow: 0 4px 24px rgba(0,0,0,.2);
}
#toast.in { transform: translateX(-50%) translateY(0); }
#toast.ok  { background: var(--green); color: #fff; }
#toast.err { background: var(--red);   color: #fff; }

/* ─── SKELETON ─── */
.sk {
  display: block;
  border-radius: 8px;
  background: linear-gradient(90deg,rgba(255,255,255,.15) 25%,rgba(255,255,255,.3) 50%,rgba(255,255,255,.15) 75%);
  background-size: 200% 100%;
  animation: sh 1.2s infinite;
}
.sk-light {
  border-radius: 8px;
  background: linear-gradient(90deg,#e8eaf6 25%,#f0f0f5 50%,#e8eaf6 75%);
  background-size: 200% 100%;
  animation: sh 1.2s infinite;
}
@keyframes sh { from{background-position:200% 0} to{background-position:-200% 0} }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <h1>💰 הכנסות ברמן</h1>
</div>

<!-- SUMMARY ROW -->
<div class="summary-row" id="summaryRow">
  <div class="s-box"><span class="sk" style="height:12px;width:60%;display:block;margin:0 auto 6px"></span><span class="sk" style="height:20px;width:80%;display:block;margin:0 auto"></span></div>
  <div class="s-box"><span class="sk" style="height:12px;width:60%;display:block;margin:0 auto 6px"></span><span class="sk" style="height:20px;width:80%;display:block;margin:0 auto"></span></div>
  <div class="s-box"><span class="sk" style="height:12px;width:60%;display:block;margin:0 auto 6px"></span><span class="sk" style="height:20px;width:80%;display:block;margin:0 auto"></span></div>
</div>

<!-- FORM CARD -->
<div class="sec">
  <div class="sec-title">➕  הוסף יום</div>
  <div class="form-pad">

    <!-- תאריך + שעות -->
    <div class="frow frow-2">
      <div class="fld">
        <label>📅 תאריך</label>
        <input type="date" id="date">
      </div>
      <div class="fld">
        <label>⏱ שעות</label>
        <input type="number" id="hours" step="0.5" min="1" max="16" placeholder="8" inputmode="decimal">
      </div>
    </div>

    <!-- סוג משמרת -->
    <div class="frow" style="margin-bottom:12px">
      <div class="fld">
        <label>🎯 משמרת</label>
        <div class="shift-pills">
          <button class="pill" onclick="pick(this,'פתיחה')">
            <span class="pi">🌅</span><span class="pt">פתיחה</span>
          </button>
          <button class="pill" onclick="pick(this,'סגירה')">
            <span class="pi">🌙</span><span class="pt">סגירה</span>
          </button>
          <button class="pill" onclick="pick(this,'כפולה')">
            <span class="pi">⚡</span><span class="pt">כפולה</span>
          </button>
        </div>
      </div>
    </div>

    <!-- סכום מגיע -->
    <div class="frow">
      <div class="fld">
        <label>💵 סכום מגיע (₪)</label>
        <input type="number" id="owed" step="0.01" min="0" placeholder="0" inputmode="decimal" oninput="calc()">
      </div>
    </div>

    <!-- מזומן + צ'ק -->
    <div class="frow frow-2">
      <div class="fld">
        <label>💰 מזומן (₪)</label>
        <input type="number" id="cash" step="0.01" min="0" placeholder="0" inputmode="decimal" oninput="calc()">
      </div>
      <div class="fld">
        <label>🏦 צ'ק (₪)</label>
        <input type="number" id="check" step="0.01" min="0" placeholder="0" inputmode="decimal" oninput="calc()">
      </div>
    </div>

    <!-- תצוגה חיה -->
    <div class="calc-strip">
      <div class="c-box">
        <div class="c-lbl">מגיע</div>
        <div class="c-val" id="cOwed">₪0</div>
      </div>
      <div class="c-box">
        <div class="c-lbl">סה"כ התקבל</div>
        <div class="c-val" id="cTotal">₪0</div>
      </div>
    </div>

    <div class="diff-tag dt-zero" id="diffTag">הפרש: ₪0.00</div>

    <!-- הערות -->
    <div class="frow">
      <div class="fld">
        <label>📝 הערות</label>
        <input type="text" id="notes" placeholder="הערה קצרה (רשות)">
      </div>
    </div>

  </div>
</div>

<!-- הזנות אחרונות -->
<div class="sec">
  <div class="sec-title">🕐  אחרונות</div>
  <div class="recent-pad" id="recentList">
    <div class="r-item"><div class="sk-light" style="height:40px;width:100%"></div></div>
    <div class="r-item"><div class="sk-light" style="height:40px;width:100%"></div></div>
    <div class="r-item"><div class="sk-light" style="height:40px;width:100%"></div></div>
  </div>
</div>

<div class="warn">
  ⚠️ תלוש שכר מתקבל ב-10 לחודש<br>ייתכן שסכומים מתחילת החודש הבא ייכנסו לתלוש הנוכחי
</div>

<!-- STICKY SAVE -->
<div class="save-bar">
  <button class="btn-save" id="btnSave" onclick="save()">✅  שמור</button>
</div>

<div id="toast"></div>

<script>
  // תאריך היום
  const td = new Date();
  document.getElementById('date').value =
    td.getFullYear() + '-' +
    String(td.getMonth()+1).padStart(2,'0') + '-' +
    String(td.getDate()).padStart(2,'0');

  let shiftVal = '';

  function pick(btn, val) {
    shiftVal = val;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('on'));
    btn.classList.add('on');
  }

  function r(n)  { return Math.round(Math.abs(n)).toLocaleString('he-IL'); }
  function f2(n) { return Math.abs(n).toFixed(2); }

  function calc() {
    const owed  = parseFloat(document.getElementById('owed').value)  || 0;
    const cash  = parseFloat(document.getElementById('cash').value)  || 0;
    const chk   = parseFloat(document.getElementById('check').value) || 0;
    const total = cash + chk;
    const diff  = total - owed;

    document.getElementById('cOwed').textContent  = '₪' + r(owed);
    document.getElementById('cTotal').textContent = '₪' + r(total);

    const tag = document.getElementById('diffTag');
    tag.className = 'diff-tag';
    if (diff > 0.005) {
      tag.classList.add('dt-pos');
      tag.textContent = 'הפרש: +₪' + f2(diff) + '  ✓ קיבלת יותר';
    } else if (diff < -0.005) {
      tag.classList.add('dt-neg');
      tag.textContent = 'הפרש: -₪' + f2(-diff) + '  ⚠️ עוד חסר';
    } else {
      tag.classList.add('dt-zero');
      tag.textContent = owed > 0 ? 'הפרש: ₪0.00  ✓ מדויק!' : 'הפרש: ₪0.00';
    }
  }

  function save() {
    if (!document.getElementById('date').value) { toast('נא להזין תאריך','err'); return; }
    const btn = document.getElementById('btnSave');
    btn.disabled = true; btn.textContent = '⏳ שומר...';
    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false; btn.textContent = '✅  שמור';
        toast(res.message, res.success ? 'ok' : 'err');
        if (res.success) { clearForm(); loadSummary(); loadRecent(); }
      })
      .withFailureHandler(e => {
        btn.disabled = false; btn.textContent = '✅  שמור';
        toast('שגיאה: ' + e.message, 'err');
      })
      .addEntry({
        date:  document.getElementById('date').value,
        shift: shiftVal,
        hours: document.getElementById('hours').value,
        owed:  document.getElementById('owed').value,
        cash:  document.getElementById('cash').value,
        check: document.getElementById('check').value,
        notes: document.getElementById('notes').value
      });
  }

  function clearForm() {
    const n = new Date();
    document.getElementById('date').value =
      n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
    ['hours','owed','cash','check','notes'].forEach(id => document.getElementById(id).value = '');
    shiftVal = '';
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('on'));
    calc();
  }

  function toast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = type;
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.classList.remove('in'); }, 2600);
  }

  function loadSummary() {
    google.script.run
      .withSuccessHandler(s => {
        const d = s.diff, pos = d >= 0;
        document.getElementById('summaryRow').innerHTML =
          `<div class="s-box">
            <div class="s-lbl">ימי עבודה</div>
            <div class="s-val">${s.days}</div>
          </div>
          <div class="s-box">
            <div class="s-lbl">סכום מגיע</div>
            <div class="s-val">₪${r(s.owed)}</div>
          </div>
          <div class="s-box ${pos?'pos':'neg'}">
            <div class="s-lbl">הפרש</div>
            <div class="s-val">${pos?'+':'-'}₪${r(d)}</div>
          </div>`;
        document.querySelector('.top-bar h1').textContent = '💰 ' + s.month;
      })
      .getCurrentMonthSummary();
  }

  function loadRecent() {
    google.script.run
      .withSuccessHandler(list => {
        const el = document.getElementById('recentList');
        if (!list || !list.length) {
          el.innerHTML = '<div class="empty">אין הזנות עדיין החודש</div>';
          return;
        }
        el.innerHTML = list.map(e => {
          const diff = parseFloat(e.diff) || 0;
          const cls  = diff >= 0 ? 'pos' : 'neg';
          const sign = diff >= 0 ? '+' : '-';
          const meta = [e.day, e.shift, e.hours ? e.hours + ' שע\'' : ''].filter(Boolean).join(' · ');
          return `<div class="r-item">
            <div>
              <div class="r-date">${e.date}</div>
              <div class="r-meta">${meta}</div>
            </div>
            <div>
              <div class="r-amt">₪${r(e.received)}</div>
              <div class="r-diff ${cls}">${sign}₪${f2(Math.abs(diff))}</div>
            </div>
          </div>`;
        }).join('');
      })
      .getRecentEntries();
  }

  loadSummary();
  loadRecent();
</script>
</body>
</html>
